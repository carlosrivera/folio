name: Release Folio Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-mac:
    # A local signing setup can keep private keys in the owner’s Keychain.
    if: ${{ vars.MACOS_RELEASE_SOURCE != 'local' }}
    name: Build & Release macOS (arm64 & x64)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Build signed and notarized macOS release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for credential in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!credential}" ]; then
              echo "::error::Missing $credential. macOS releases must be signed and notarized."
              exit 1
            fi
          done
          pnpm exec electron-builder --mac --publish never --config.forceCodeSigning=true
          for bundle in dist-packaged.noindex/mac*/Folio.app; do
            codesign --verify --deep --strict "$bundle"
            spctl --assess --type execute --verbose "$bundle"
            xcrun stapler validate "$bundle"
          done

      - name: Upload verified macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="v$(node -p 'require("./package.json").version')"
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" --verify-tag --draft --title "Folio ${release_tag#v}"
          fi
          gh release upload "$release_tag" dist-packaged.noindex/*.dmg dist-packaged.noindex/*.zip dist-packaged.noindex/*.blockmap dist-packaged.noindex/latest-mac.yml --clobber

  release-win:
    name: Build & Release Windows (x64 & arm64)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Build & Publish Windows Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec electron-builder --win --publish always

  release-linux:
    name: Build & Release Linux (AppImage & deb)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools fakeroot dpkg

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Build & Publish Linux Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec electron-builder --linux --publish always
