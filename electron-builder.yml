appId: im.carlosrivera.folio
productName: Folio
copyright: Copyright © 2026 Carlos Rivera

directories:
  output: dist-packaged
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - scripts/export-pdf-cli.cjs
  - bin/**
  - package.json

publish:
  provider: github
  owner: carlosrivera
  repo: folio
  releaseType: release

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  electronLanguages:
    - en
    - es
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false

linux:
  category: Office
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

