<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24252a" />
      <stop offset="100%" stop-color="#131416" />
    </linearGradient>

    <!-- Squircle border highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4d56" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#222327" stop-opacity="0.3" />
    </linearGradient>

    <!-- Terracotta accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c85433" />
      <stop offset="100%" stop-color="#ba4e31" />
    </linearGradient>

    <!-- Page drop shadows -->
    <filter id="tileShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="sheetShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#ba4e31" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Outer squircle tile with macOS proportions (continuous squircle approximation) -->
  <g filter="url(#tileShadow)">
    <rect x="36" y="36" width="440" height="440" rx="98" ry="98" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  </g>

  <!-- Stacked sheets matching Folio macOS App icon -->
  <!-- Back sheet (tilted right) -->
  <rect x="156" y="105" width="220" height="305" rx="14" fill="#eae7df" transform="rotate(8.5 266 257)" opacity="0.9" />

  <!-- Middle sheet (tilted slight right) -->
  <rect x="156" y="105" width="220" height="305" rx="14" fill="#f5f4ef" transform="rotate(3 266 257)" opacity="0.95" />

  <!-- Front sheet with signature terracotta F/ mark (tilted left) -->
  <g transform="rotate(-6.5 266 257)" filter="url(#sheetShadow)">
    <rect x="156" y="105" width="220" height="305" rx="14" fill="#ffffff" />
    
    <!-- Bold Terracotta F/ Mark centered on the sheet -->
    <g transform="translate(202, 192) scale(0.58)">
      <!-- F -->
      <path d="M 4 4 L 128 4 L 128 39 L 39 39 L 39 70 L 92 70 L 92 105 L 39 105 L 39 179 L 4 179 Z" fill="#ba4e31" />
      <!-- / with rounded terminals -->
      <path d="M 185 4 C 205 4 218 16 214 30 L 163 174 C 160 181 152 184 144 184 C 130 184 124 173 128 160 L 175 14 C 177 7 180 4 185 4 Z" fill="#ba4e31" />
    </g>
  </g>
</svg>
