<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>

    <!-- Squircle border highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4a52" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2a2a30" stop-opacity="0.2" />
    </linearGradient>

    <!-- Terracotta accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dd6948" />
      <stop offset="100%" stop-color="#b84729" />
    </linearGradient>

    <!-- Page drop shadows -->
    <filter id="pageShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer squircle tile with macOS proportions (Apple continuous squircle approximation) -->
  <g filter="url(#tileShadow)">
    <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  </g>

  <!-- Stacked sheets -->
  <g filter="url(#pageShadow)">
    <!-- Back sheet (tilted left -5deg) -->
    <rect x="135" y="70" width="240" height="340" rx="18" fill="#eae8e2" transform="rotate(-6 255 240)" opacity="0.65" />

    <!-- Middle sheet (tilted right +3deg) -->
    <rect x="135" y="70" width="240" height="340" rx="18" fill="#f4f3ee" transform="rotate(3 255 240)" opacity="0.85" />

    <!-- Front sheet (slightly tilted -1deg) -->
    <g transform="rotate(-1.5 255 240)">
      <rect x="135" y="70" width="240" height="340" rx="18" fill="#fdfcf9" />

      <!-- Subtle document margin & layout guide lines -->
      <line x1="165" y1="100" x2="165" y2="380" stroke="#eae7df" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="345" y1="100" x2="345" y2="380" stroke="#eae7df" stroke-width="1.5" stroke-dasharray="3 3" />
      <line x1="165" y1="100" x2="345" y2="100" stroke="#eae7df" stroke-width="1.5" />
      <line x1="165" y1="380" x2="345" y2="380" stroke="#eae7df" stroke-width="1.5" />

      <!-- Signature terracotta 'F/' mark -->
      <text x="255" y="260"
            font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif"
            font-size="112"
            font-weight="800"
            letter-spacing="-4"
            fill="url(#accentGrad)"
            text-anchor="middle"
            dominant-baseline="central">F/</text>

      <!-- Document pagination indicator cue '01' -->
      <text x="330" y="365"
            font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace"
            font-size="13"
            font-weight="600"
            fill="#a6a49c"
            text-anchor="end">01</text>
    </g>
  </g>
</svg>
